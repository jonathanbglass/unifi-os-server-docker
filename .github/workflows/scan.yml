name: Lint and scan

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, hadolint, shellcheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          curl -sSLo /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - name: actionlint
        run: actionlint -color

      - name: hadolint
        run: hadolint --config .hadolint.yaml Dockerfile

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
